name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Verification depth for this manual run
        required: true
        default: full
        type: choice
        options:
          - full
          - matrix

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  affected:
    name: Fast affected verification
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: ci-fast-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: affected
          cache-size-limit: 1024

      - name: Resolve affected base
        id: affected-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              ;;
            *)
              echo "unsupported event for affected verification: $GITHUB_EVENT_NAME" >&2
              exit 64
              ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "event does not provide a usable affected base" >&2
            exit 64
          fi
          event_base="$base"
          if ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            if ! git fetch --no-tags --depth=1 origin "$base"; then
              echo "cannot fetch exact affected base: $event_base" >&2
              exit 64
            fi
          fi
          if ! base="$(git rev-parse --verify "${event_base}^{commit}")"; then
            echo "cannot resolve exact affected base: $event_base" >&2
            exit 64
          fi
          printf 'base=%s\n' "$base" >>"$GITHUB_OUTPUT"

      - name: Run bounded affected gates
        env:
          GLACIER_VERIFY_REUSE_ZIG_CACHE: "1"
        run: >-
          tools/verify.sh affected-fast
          --base "${{ steps.affected-base.outputs.base }}"

  exhaustive:
    name: Exhaustive verification (${{ inputs.profile || 'matrix' }})
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GLACIER_VERIFY_REQUIRE_NATIVE: "1"
      VERIFY_PROFILE: ${{ inputs.profile || 'matrix' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: exhaustive
          cache-size-limit: 2048

      - name: Install Python test dependencies
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r bench/requirements-test.txt

      - name: Run requested verification profile
        env:
          GLACIER_VERIFY_REUSE_ZIG_CACHE: "1"
        run: tools/verify.sh "$VERIFY_PROFILE"

  macos-frontier:
    name: macOS Metal and durability frontier
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.profile == 'matrix') ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zig and bounded cache
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: exhaustive-metal
          cache-size-limit: 2048

      - name: Compile Metal closure without execution claims
        run: >-
          zig build native-metal-suite-compile
          -Dmetal-output-dir="${RUNNER_TEMP}/glacier-metal"
          -Dmetal=true
          -Doptimize=ReleaseSafe
          -j2

      - name: Run durable model-conversion recovery
        run: >-
          zig build model-conversion-durable-recovery-test
          -Dmetal=false
          -Doptimize=ReleaseSafe
          -j2
